<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' file:; script-src 'self' file:; img-src 'self' file:" />
<title>Animke</title>
<link rel="stylesheet" href="titlebar.css" />
</head>
<body>
  <div class="bar">
    <img class="logo" src="../../build/icon.png" alt="" />
    <button id="back" class="icon" title="Geri (Alt+←)" aria-label="Geri" disabled>
      <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" /></svg>
    </button>
    <button id="forward" class="icon" title="İleri (Alt+→)" aria-label="İleri" disabled>
      <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6" /></svg>
    </button>
    <button id="reload" class="text" title="Yenile (F5)">
      <svg class="spin-target" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36" /><path d="M21 3v6h-6" /></svg>
      <span>Yenile</span>
    </button>
    <button id="home" class="text" title="Ana sayfa">
      <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8" /><path d="M5 10v10h14V10" /></svg>
      <span>Ana Sayfa</span>
    </button>
    <button id="pip" class="text" title="Videoyu her zaman üstte duran küçük pencerede izle" disabled>
      <svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2" /><rect x="12" y="11" width="8" height="7" rx="1" /></svg>
      <span>Mini Oynatıcı</span>
    </button>
    <button id="settings" class="text" title="Uygulama ayarları">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" /></svg>
      <span>Ayarlar</span>
    </button>
    <div class="title" id="title">Animke</div>
  </div>
  <script src="titlebar.js"></script>
</body>
</html>
